        - generic [ref=e52]:
          - heading "A choice about the future of We Suck Less" [level=2] [ref=e53]
          - paragraph [ref=e54]:
            - generic [ref=e56]:
              - text: The internet is changing, and not in a way that benefits you.
              - text: Right now, every piece of knowledge you share and every script you download is being scraped, packaged, and sold back to you by companies that didn't build any of it. Most "free" resources today are just traps designed to mine your data or bury you in ads.
              - text: I’ve spent over a decade building We Suck Less to be the exact opposite of that.
              - text: It’s independent. It’s ad-free. It’s privacy-focused. And it’s arguably the best Fusion and Resolve resource on the planet. I’m proud of that. I’m proud that we’ve kept it clean while the rest of the industry is selling out.
              - text: "But here’s the reality we have to face: Independence isn't free."
              - text: You’re probably thinking, "
              - emphasis [ref=e57]: If it’s a labor of love, why does it need a Patreon?
              - text: "\" You might even feel like asking for support compromises the very independence I’m talking about."
              - text: That’s a fair point.
              - text: But staying independent means we don't have corporate "data partners" to fund the development of our community. It means the weight of keeping this resource alive - and keeping it out of the hands of the scrapers - falls entirely on me.
              - text: How are we supposed to keep this a private and independent space if we don't have the resources to defend it?
              - text: What happens to this community if the only way to keep the lights on is to start playing the same "data-mining" game as everyone else?
              - text: We aren't looking for donations. We’re looking for people who believe that a high-end, professional resource is worth protecting from the Big Tech model.
              - strong [ref=e58]: Is it a totally ridiculous idea to chip in a few bucks a month to make sure this resource stays alive for you?
              - text: If you’re fine with the way the rest of the internet works these days, then this Patreon isn't for you. But if you want to make sure We Suck Less remains the best resource in the industry, we could use your help.
