<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
/* CSS_PLACEHOLDER */
</style>
</head>
<body>

<!-- Titlebar -->
<div class="titlebar">
  <span class="tb-dots"><span class="tb-dot a"></span><span class="tb-dot b"></span><span class="tb-dot b"></span></span>
  <span>批量文件命名工具 · 创壹特供版</span>
  <span style="color:#444;font-size:9px" id="debugMode">loading...</span>
</div>

<!-- Inspector — 由 JS 从 FIELD_CONFIG 动态生成 -->
<div class="inspector" id="inspector"></div>

<!-- Action Bar — 仅重命名+撤销（无归档/路径） -->
<div class="action-bar">
  <button class="hero-btn" id="btnRename" disabled>批量重命名</button>
  <button class="hero-undo" id="btnUndo" disabled>↩ 撤销</button>
</div>

<!-- File List -->
<div class="file-section">
  <div class="fl-bar">
    <span id="fileCount">文件列表 · 0 个</span>
    <div class="fl-bar-right">
      <span class="zoom-label" id="zoomLabel">100%</span>
      <input type="range" class="zoom-slider" id="zoomSlider" min="50" max="200" value="100" step="1">
      <button class="fl-btn" id="btnAdd">+ 添加</button>
    </div>
  </div>
  <div class="fl-body" id="fileList">
    <div class="fl-empty">拖放文件到此处 或 点击 +文件</div>
  </div>
  <div class="drop-overlay" id="dropOverlay"><span>释放以添加文件</span></div>
</div>

<!-- Status Bar -->
<div class="statusbar">
  <span class="sb-left"><span class="sb-dot"></span> <span id="statusText">就绪  ·  Ctrl+Z 撤销  ·  Del 移除</span><span id="resultMsg"></span></span>
  <span>裁缝老师的达芬奇插件工坊 · 创壹特供版 v1.0</span>
</div>

<!-- Overlays -->
<div class="toast" id="toast"></div>
<div class="dialog-overlay" id="dialogOverlay">
  <div class="dialog">
    <h3 id="dialogTitle">确认</h3>
    <p id="dialogMsg"></p>
    <div class="dialog-btns">
      <button class="cancel" id="dialogCancel">取消</button>
      <button class="ok" id="dialogOk">确认</button>
    </div>
  </div>
</div>

<script>
// JS_PLACEHOLDER
</script>
</body>
</html>
