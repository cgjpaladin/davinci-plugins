<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
/* CSS_PLACEHOLDER */
</style>
</head>
<body>

<!-- Titlebar -->
<div class="titlebar">
  <span class="tb-dots"><span class="tb-dot a"></span><span class="tb-dot b"></span><span class="tb-dot b"></span></span>
  <span>批量文件命名工具</span>
  <span style="color:#444;font-size:9px" id="debugMode">loading...</span>
</div>

  <!-- Inspector — 占位符提示，无预填值 -->
  <div class="inspector" id="inspector">
    <div class="param"><label>Ep 集数</label><input data-key="ep" value="" placeholder="01" style="color:var(--text-dim)"></div>
    <div class="param"><label>Sc 场次</label><input data-key="sc" value="" placeholder="01" style="color:var(--text-dim)"></div>
    <div class="param"><label>Gr 小场次</label><input data-key="gr" value="" placeholder="01" style="color:var(--text-dim)"></div>
    <div class="param"><label>Tk 次数</label><input data-key="tk" value="自动排序" readonly></div>
    <div class="param wide"><label>镜头描述</label><input id="descInput" data-key="desc" value="" placeholder="由制作方式决定" readonly></div>
    <div class="param"><label>制作者</label><input data-key="author" id="authorInput" value="" placeholder="请输入姓名" style="color:var(--text-dim)"></div>
    <div class="param"><label>制作方式</label><select id="methodSelect" data-key="method"><option value="">请选择</option><option value="智能分镜版">智能分镜版</option><option value="双轨版">双轨版</option><option value="角色专属版">角色专属版</option></select></div>
    <div class="param"><label>版本号</label><input data-key="ver" value="" placeholder="01" style="color:var(--text-dim)"></div>
    <div class="param"><label>通过情况</label><select data-key="status"><option value="">请选择</option><option value="OK">OK</option><option value="KP">KP</option><option value="NG">NG</option></select></div>
  </div>

<!-- Dest + Buttons -->
<div class="dest">
  <label>目标路径</label>
  <input id="destInput" value="" placeholder="点击 🗂 选择项目文件夹，或粘贴路径">
  <button class="fl-btn" id="btnBrowseDest" style="flex-shrink:0">🗂</button>
  <span class="dest-ok" id="destStatus"></span>
  <button class="hero-btn" id="btnRename" disabled>批量重命名</button>
  <button class="hero-archive" id="btnArchive" disabled>批量归档</button>
  <button class="hero-undo" id="btnUndo" disabled>↩ 撤销</button>
</div>

<!-- File List -->
<div class="file-section">
  <div class="fl-bar">
    <span id="fileCount">文件列表 · 0 个</span>
    <div class="fl-bar-right">
      <span class="zoom-label" id="zoomLabel">100%</span>
      <input type="range" class="zoom-slider" id="zoomSlider" min="50" max="200" value="100" step="1">
      <button class="fl-btn" id="btnAdd">+ 添加</button>
    </div>
  </div>
  <div class="fl-body" id="fileList">
    <div class="fl-empty">拖放文件到此处 或 点击 +文件</div>
  </div>
  <div class="drop-overlay" id="dropOverlay"><span>释放以添加文件</span></div>
</div>

<!-- Status Bar -->
<div class="statusbar">
  <span class="sb-left"><span class="sb-dot"></span> <span id="statusText">就绪  ·  Ctrl+Z 撤销  ·  Del 移除</span></span>
  <span>裁缝老师的达芬奇插件工坊 · v3.0</span>
</div>

<!-- Overlays -->
<div class="toast" id="toast"></div>
<div class="dialog-overlay" id="dialogOverlay">
  <div class="dialog">
    <h3 id="dialogTitle">确认</h3>
    <p id="dialogMsg"></p>
    <div class="dialog-btns">
      <button class="cancel" id="dialogCancel">取消</button>
      <button class="ok" id="dialogOk">确认</button>
    </div>
  </div>
</div>

<script>
// JS_PLACEHOLDER
</script>
</body>
</html>
