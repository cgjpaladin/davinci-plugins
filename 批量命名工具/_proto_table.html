<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>表格视图 · 四版原型</title>
<style>
:root{--bg:#0d0d12;--surface:#13131b;--text:#e0dfe4;--dim:#8f8e94;--accent:#a477c8;--green:#34d399;--yellow:#f59e0b;--red:#ef4444;--border:rgba(255,255,255,.06);--radius:6px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Tab Bar ── */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;padding:0 16px}
.tab{padding:10px 20px;cursor:pointer;color:var(--dim);font-size:13px;border-bottom:2px solid transparent;transition:all .15s;user-select:none;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── Panels ── */
.panel{display:none;flex:1;overflow-y:auto;padding:12px 16px}
.panel.active{display:flex;flex-direction:column}

/* ── Shared table base ── */
table{border-collapse:collapse;width:100%;table-layout:auto;font-size:13px}
th,td{white-space:nowrap;text-align:left}
th{font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--dim);position:sticky;top:0;z-index:1}
.th-sort{display:inline-block;margin-left:3px;opacity:.3}

/* cell basics */
.cell-empty{color:var(--dim);font-style:italic}
.cell-input{background:transparent;border:none;color:inherit;font:inherit;width:100%;outline:none;padding:0}
.cell-select{background:transparent;border:none;color:inherit;font:inherit;outline:none;cursor:pointer;-webkit-appearance:none;-moz-appearance:none;width:100%}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.thumb{background:#1a1a24;border-radius:3px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.thumb::after{content:'▶';position:absolute;font-size:7px;color:rgba(255,255,255,.25)}
.col-num{text-align:right;padding-right:12px!important;font-variant-numeric:tabular-nums}
.col-ep,.col-sc,.col-gr,.col-tk,.col-ver{text-align:center;width:48px}
.col-status{text-align:center;width:56px}
.col-base{min-width:140px}

/* ──────────────────────────────────────────── */
/* STYLE 1 — Airtable Light                 */
/* ──────────────────────────────────────────── */
.panel-airtable{background:#fafafc}
.panel-airtable table{color:#1a1a2e}
.panel-airtable th{background:#ecedf2;color:#6b6b80;padding:8px 12px;border-bottom:1px solid #dcdce5}
.panel-airtable td{padding:7px 12px;border-bottom:1px solid #e8e8f0}
.panel-airtable tr:nth-child(even) td{background:#f3f3f9}
.panel-airtable tr:hover td{background:#eef0ff}
.panel-airtable tr.sel td{background:#e3e9ff;border-left:3px solid #2d7ff9;padding-left:9px}
.panel-airtable tr.warn td{background:#fff0f0;border-left:3px solid #e5484d;padding-left:9px}
.panel-airtable .cell-input:focus,.panel-airtable .cell-select:focus{outline:2px solid #2d7ff9;outline-offset:-2px;border-radius:2px;background:#fff}
.panel-airtable .dot{width:8px;height:8px}
.panel-airtable .thumb{background:#dddde8;width:28px;height:28px}
.panel-airtable .col-num{color:#9b9bb0}

/* ──────────────────────────────────────────── */
/* STYLE 2 — Notion Minimal                 */
/* ──────────────────────────────────────────── */
.panel-notion{background:#fafaf8}
.panel-notion table{color:#37352f}
.panel-notion th{background:#fafaf8;color:#9b9a97;padding:6px 10px 4px;border-bottom:1px solid #e9e9e2;font-weight:400;font-size:11.5px}
.panel-notion td{padding:5px 10px}
.panel-notion tr td{border-bottom:1px solid transparent}
.panel-notion tr:hover td{background:#f7f6f3}
.panel-notion tr.sel td{background:#eaf0fa;border-left:2px solid #448aff;padding-left:8px}
.panel-notion tr.warn td{background:#fef0f0;border-left:2px solid #e16259;padding-left:8px}
.panel-notion .cell-input:focus{background:#fff;outline:2px solid #448aff;outline-offset:-1px;border-radius:2px;padding:2px 4px}
.panel-notion .cell-select:focus{outline:2px solid #448aff;outline-offset:-1px;border-radius:2px}
.panel-notion .dot{width:6px;height:6px}
.panel-notion .thumb{background:#eee;width:24px;height:24px}
.panel-notion .col-num{color:#c1c0bb}

/* ──────────────────────────────────────────── */
/* STYLE 3 — Linear Dark                    */
/* ──────────────────────────────────────────── */
.panel-linear{background:#0d0e12}
.panel-linear table{color:#dbdee3}
.panel-linear th{background:#0d0e12;color:#656d7b;padding:8px 12px 6px;border-bottom:1px solid #1e2028;font-weight:500;font-size:10.5px;letter-spacing:.04em}
.panel-linear td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.03)}
.panel-linear tr:hover td{background:#16171d}
.panel-linear tr.sel td{background:#1c1f2e;border-left:2px solid #5e6ad2;padding-left:10px}
.panel-linear tr.warn td{background:#1f1218;border-left:2px solid #e5484d;padding-left:10px}
.panel-linear .cell-input:focus{background:#1a1b26;outline:1px solid #5e6ad2;outline-offset:-1px;border-radius:3px;padding:2px 4px;color:#fff}
.panel-linear .cell-select:focus{outline:1px solid #5e6ad2;outline-offset:-1px;border-radius:3px;background:#1a1b26}
.panel-linear .dot{width:7px;height:7px;box-shadow:0 0 4px currentColor}
.panel-linear .thumb{background:#16171d;border:1px solid #1e2028;width:28px;height:28px;border-radius:4px}
.panel-linear .col-num{color:#4c5362}

/* ──────────────────────────────────────────── */
/* STYLE 4 — NocoDB Spreadsheet             */
/* ──────────────────────────────────────────── */
.panel-nocodb{background:#fff}
.panel-nocodb table{color:#222;border:1px solid #d1d5db}
.panel-nocodb th{background:#f3f4f6;color:#374151;padding:6px 10px;border:1px solid #d1d5db;font-weight:600;font-size:11px}
.panel-nocodb td{padding:5px 10px;border:1px solid #e5e7eb}
.panel-nocodb tr:hover td{background:#f0f9ff}
.panel-nocodb tr.sel td{background:#dbeafe;border-left-width:3px;border-left-color:#3b82f6}
.panel-nocodb tr.warn td{background:#fee2e2;border-left:3px solid #ef4444}
.panel-nocodb .cell-input:focus{background:#fff;outline:2px solid #3b82f6;outline-offset:-1px}
.panel-nocodb .cell-select:focus{outline:2px solid #3b82f6;outline-offset:-1px}
.panel-nocodb .dot{width:7px;height:7px}
.panel-nocodb .thumb{background:#f3f4f6;border:1px solid #d1d5db;width:26px;height:26px;border-radius:2px}
.panel-nocodb .col-num{color:#9ca3af}

/* ── Info strip ── */
.info{flex-shrink:0;padding:8px 16px;font-size:11px;color:var(--dim);background:var(--surface);border-top:1px solid var(--border)}
.info span{color:var(--accent)}
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" data-panel="airtable">① Airtable — 轻彩格线</div>
  <div class="tab" data-panel="notion">② Notion — 极简无色</div>
  <div class="tab" data-panel="linear">③ Linear — 暗色高对比</div>
  <div class="tab" data-panel="nocodb">④ NocoDB — 传统电子表格</div>
</div>

<div id="airtable" class="panel panel-airtable active">
  <table><thead><tr>
    <th class="col-num">#</th>
    <th style="width:36px"></th>
    <th>Ep</th><th>Sc</th><th>Gr</th><th>Tk</th>
    <th style="min-width:90px">镜头描述</th>
    <th style="min-width:60px">制作者</th>
    <th style="min-width:80px">制作方式</th>
    <th>v</th>
    <th style="min-width:50px">通过</th>
    <th class="col-base">原名</th>
  </tr></thead><tbody></tbody></table>
</div>

<div id="notion" class="panel panel-notion">
  <table><thead><tr>
    <th class="col-num">#</th>
    <th style="width:32px"></th>
    <th>Ep</th><th>Sc</th><th>Gr</th><th>Tk</th>
    <th style="min-width:90px">镜头描述</th>
    <th style="min-width:60px">制作者</th>
    <th style="min-width:80px">制作方式</th>
    <th>v</th>
    <th style="min-width:50px">通过</th>
    <th class="col-base">原名</th>
  </tr></thead><tbody></tbody></table>
</div>

<div id="linear" class="panel panel-linear">
  <table><thead><tr>
    <th class="col-num">#</th>
    <th style="width:36px"></th>
    <th>Ep</th><th>Sc</th><th>Gr</th><th>Tk</th>
    <th style="min-width:90px">镜头描述</th>
    <th style="min-width:60px">制作者</th>
    <th style="min-width:80px">制作方式</th>
    <th>v</th>
    <th style="min-width:50px">通过</th>
    <th class="col-base">原名</th>
  </tr></thead><tbody></tbody></table>
</div>

<div id="nocodb" class="panel panel-nocodb">
  <table><thead><tr>
    <th class="col-num">#</th>
    <th style="width:34px"><input type="checkbox" style="margin:0" onclick="toggleAll(this)" title="全选"></th>
    <th>Ep</th><th>Sc</th><th>Gr</th><th>Tk</th>
    <th style="min-width:90px">镜头描述</th>
    <th style="min-width:60px">制作者</th>
    <th style="min-width:80px">制作方式</th>
    <th>v</th>
    <th style="min-width:50px">通过</th>
    <th class="col-base">原名</th>
  </tr></thead><tbody></tbody></table>
</div>

<div class="info">
  模拟数据 7 行 · <span>点击行切换选中态</span> · 蓝色=选中 · 红底=文件异常
</div>

<script>
const DATA = [
  {ep:'01',sc:'02',gr:'03',tk:'01',desc:'全能分镜',author:'张谭',method:'智能分镜版',ver:'01',status:'OK',  base:'C01_男主中景_20260301_0930.mp4',     tags:[]},
  {ep:'01',sc:'02',gr:'03',tk:'02',desc:'空镜',    author:'张谭',method:'双轨版',    ver:'01',status:'OK',  base:'C01_女主近景_20260301_0931.mp4',     tags:[]},
  {ep:'01',sc:'02',gr:'03',tk:'03',desc:'空镜',    author:'李四',method:'双轨版',    ver:'01',status:'OK',  base:'C01_空镜街道_20260301_0932.mp4',     tags:[]},
  {ep:'02',sc:'01',gr:'01',tk:'01',desc:'温时雨过肩中景',author:'温欣然',method:'角色专属版',ver:'02',status:'待审',base:'C02_过肩中景_20260302_1400.mp4',   tags:[]},
  {ep:'02',sc:'01',gr:'01',tk:'01',desc:'幽灵角色', author:'张谭',method:'双轨版',    ver:'01',status:'OK',  base:'C02_幽灵角色_20260302_1401.mp4',     tags:['zero']},
  {ep:'02',sc:'01',gr:'02',tk:'―', desc:'—',       author:'—', method:'—',          ver:'―', status:'―',   base:'C02_待定镜头_20260302_1402.mp4',     tags:[]},
  {ep:'03',sc:'04',gr:'05',tk:'01',desc:'特写',    author:'张谭',method:'角色专属版',ver:'03',status:'OK',  base:'C03_特写镜头_20260303_0800.mp4',     tags:['dbl_ext']},
];

function statusDot(s,tags){
  if(tags.length) return ` style="background:var(--red)"`;
  if(s==='OK'||s==='待审') return ` style="background:var(--green)"`;
  return ` style="background:var(--yellow)"`;
}

function buildRow(d,i){
  const hasTags = d.tags.length>0;
  const cls = hasTags?'warn':'';
  const methodOpts = ['智能分镜版','双轨版','角色专属版'].map(m=>`<option${d.method===m?' selected':''}>${m}</option>`).join('');
  const statusOpts = ['OK','待审'].map(s=>`<option${d.status===s?' selected':''}>${s}</option>`).join('');
  const empty = v => v==='―'||v==='—' ? `<span class="cell-empty">${v}</span>` : v;
  return `<tr class="${cls}" onclick="toggleSel(this)">
    <td class="col-num">${i+1}</td>
    <td><div class="thumb"></div></td>
    <td class="col-ep">${empty(d.ep)}</td>
    <td class="col-sc">${empty(d.sc)}</td>
    <td class="col-gr">${empty(d.gr)}</td>
    <td class="col-tk">${empty(d.tk)}</td>
    <td>${empty(d.desc)}</td>
    <td>${empty(d.author)}</td>
    <td><select class="cell-select" onclick="event.stopPropagation()" onchange="this.blur()">${methodOpts}</select></td>
    <td class="col-ver">${empty(d.ver)}</td>
    <td class="col-status"><span class="dot"${statusDot(d.status,d.tags)}></span>${empty(d.status)}</td>
    <td class="col-base" style="font-size:12px;color:var(--dim)">${d.base}</td>
  </tr>`;
}

function populate(){
  const rows = DATA.map((d,i)=>buildRow(d,i)).join('');
  document.querySelectorAll('table tbody').forEach(b=>b.innerHTML=rows);
}
function toggleSel(tr){tr.classList.toggle('sel')}
function toggleAll(cb){
  const panel = cb.closest('.panel');
  panel.querySelectorAll('tr').forEach(tr=>{
    if(cb.checked)tr.classList.add('sel');else tr.classList.remove('sel');
  });
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.panel).classList.add('active');
  });
});

populate();
</script>
</body>
</html>
