<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
/* CSS_PLACEHOLDER */
</style>
</head>
<body>

<!-- Titlebar -->
<div class="titlebar">
  <span class="tb-dots"><span class="tb-dot a"></span><span class="tb-dot b"></span><span class="tb-dot b"></span></span>
  <span>批量文件命名工具</span>
  <span style="color:#444;font-size:9px" id="debugMode">loading...</span>
</div>

  <!-- Inspector — 由 JS 从 FIELD_CONFIG 动态生成 -->
  <div class="inspector" id="inspector"></div>

<!-- Dest + Buttons -->
<div class="dest">
  <label>目标路径</label>
  <input id="destInput" value="" placeholder="点击 🗂 选择项目文件夹，或粘贴路径">
  <button class="fl-btn" id="btnBrowseDest" style="flex-shrink:0">🗂</button>
  <span class="dest-ok" id="destStatus"></span>
  <button class="hero-btn" id="btnRename" disabled>批量重命名</button>
  <button class="hero-archive" id="btnArchive" disabled>批量归档</button>
  <button class="hero-undo" id="btnUndo" disabled>↩ 撤销</button>
</div>

<!-- File List -->
<div class="file-section">
  <div class="fl-bar">
    <span id="fileCount">文件列表 · 0 个</span>
    <div class="fl-bar-right">
      <span class="zoom-label" id="zoomLabel">100%</span>
      <input type="range" class="zoom-slider" id="zoomSlider" min="50" max="200" value="100" step="1">
    </div>
  </div>
  <div class="fl-body" id="fileList">
    <table>
      <thead><tr>
        <th class="col-num">序号</th>
        <th class="col-thumb">缩略图</th>
        <!-- 字段表头由 JS init() 动态生成 -->
        <th class="col-base">原文件名</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div class="fl-empty">
      <div>
        <div class="fl-empty-icon">📁</div>
        <div class="fl-empty-text">拖放素材到此处，或点击按钮</div>
        <button class="fl-empty-btn" id="btnAddBig">+ 添加</button>
      </div>
    </div>
  </div>
  <div class="drop-overlay" id="dropOverlay"><span>释放以添加文件</span></div>
</div>

<!-- Status Bar -->
<div class="statusbar">
  <span class="sb-left"><span class="sb-dot"></span> <span id="statusText">就绪  ·  Ctrl+Z 撤销  ·  Del 移除</span></span>
  <span>裁缝老师的达芬奇插件工坊 · v2.0</span>
</div>

<!-- Overlays -->
<div class="toast" id="toast"></div>
<div class="dialog-overlay" id="dialogOverlay">
  <div class="dialog">
    <h3 id="dialogTitle">确认</h3>
    <p id="dialogMsg"></p>
    <div class="dialog-btns">
      <button class="cancel" id="dialogCancel">取消</button>
      <button class="ok" id="dialogOk">确认</button>
    </div>
  </div>
</div>

<script>
// JS_PLACEHOLDER
</script>
</body>
</html>
