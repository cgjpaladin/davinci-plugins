<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>/* CSS_PLACEHOLDER */</style>
</head>
<body>
<div class="app">

<div class="titlebar">
  <span class="tb-dots"><span class="tb-dot a"></span><span class="tb-dot b"></span><span class="tb-dot b"></span></span>
  <span>批量文件命名工具</span>
  <span class="debug" id="debugMode" title="点击复制调试日志"></span>
</div>

<div class="toolbar">
  <button id="btnAddFiles">+ 添加文件</button>
  <button id="btnAddFolder">+ 添加文件夹</button>
  <button id="btnClear">清空</button>
  <span class="toolbar-sep"></span>
  <button id="btnRename">重命名</button>
  <button id="btnArchive">归档</button>
  <span class="toolbar-sep"></span>
  <button id="btnUndo" disabled>↩ 撤销</button>
</div>

<div class="table-area">
  <div id="hot"></div>
  <div class="empty-msg" id="emptyMsg">拖放文件/文件夹到此处</div>
</div>

<div class="statusbar">
  <span class="sb-left"><span id="statusText">就绪</span></span>
  <span id="resultMsg"></span>
  <span>裁缝老师的达芬奇插件工坊 · v4.0</span>
</div>

</div>
<script>// JS_PLACEHOLDER</script>
</body>
</html>
